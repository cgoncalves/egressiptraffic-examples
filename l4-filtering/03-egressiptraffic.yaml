# EgressIPTraffic with L4 protocol/port filtering.
# Only HTTP traffic (TCP 8080) to the destination network will use the EgressIP.
apiVersion: k8s.ovn.org/v1
kind: EgressIPTraffic
metadata:
  name: eipt-oam-l4
  labels:
    traffic-group: oam-l4
spec:
  trafficMatchers:
  - cidr: "192.168.250.0/24"
    protocol: TCP
    destinationPort: 8080
