# EgressIPTraffic for SIP signaling: L4-filtered (UDP port 5060 to OAM network)
apiVersion: k8s.ovn.org/v1
kind: EgressIPTraffic
metadata:
  name: eipt-sip
  labels:
    traffic-group: sip
spec:
  trafficMatchers:
  - cidr: "192.168.250.0/24"
    protocol: UDP
    destinationPort: 5060
---
# EgressIPTraffic for signaling: CIDR-only (all traffic to signaling network)
apiVersion: k8s.ovn.org/v1
kind: EgressIPTraffic
metadata:
  name: eipt-signaling
  labels:
    traffic-group: signaling
spec:
  trafficMatchers:
  - cidr: "192.168.251.0/24"
